# Laser-Proxy auf dem Waveshare ESP32-S3-ETH mit zusaetzlichem W5500-Modul:
#   eingebauter Port (W5500, PoE)  -> Vereinsnetz (DHCP)
#   W5500-Modul                    -> Laser-Controller (eigenes Netz 192.168.1.0/24)
# Eingebauter W5500 laut Waveshare-Wiki: MISO 12, MOSI 11, SCLK 13, CS 14, INT 10, RST 9.
# Diese Pins liegen nicht auf der Stiftleiste, das Modul bekommt deshalb einen
# eigenen SPI-Bus (SPI3). Verdrahtung: siehe README.md

substitutions:
  name: laser-proxy
  friendly_name: Laser-Proxy

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
  # Ausserhalb dieses Repos (z.B. im ESPHome-Dashboard von Home Assistant):
  # - source: github://OffeneWerkstattMainz/laser-proxy@main

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Ohne verbundenes Home Assistant nicht alle 15 Minuten neu starten
  reboot_timeout: 0s

ota:
  - platform: esphome
    # Nutzt denselben Schluessel wie die API
    encryption: {}

web_server:
  port: 80

# Eingebauter Port ins Vereinsnetz
ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  interface: spi2
  # Statt DHCP eine feste Adresse im Vereinsnetz:
  # manual_ip:
  #   static_ip: 192.168.0.50
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0

# W5500-Modul zum Laser, an der linken Stiftleiste (Pin 25 bis 36)
laser_proxy:
  w5500:
    clk_pin: GPIO17       # Pin 34
    mosi_pin: GPIO16      # Pin 32
    miso_pin: GPIO18      # Pin 31
    cs_pin: GPIO15        # Pin 29
    interrupt_pin: GPIO2  # Pin 26
    reset_pin: GPIO1      # Pin 25
    spi_host: SPI3
  local_ip: 192.168.1.1
  laser_ip: 192.168.1.100
  # Nur Clients aus diesem Netz duerfen den Laser ansprechen (Standard: alle)
  # allowed_network: 192.168.0.0/24
  laser_link:
    name: Laser verbunden
  client:
    name: Aktiver Client
  packets_to_laser:
    name: Pakete zum Laser
  packets_from_laser:
    name: Pakete vom Laser
  packets_dropped:
    name: Verworfene Pakete

button:
  - platform: restart
    name: Neustart
